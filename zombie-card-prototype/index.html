<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Zombie Card Prototype</title>
<style>
:root{--bg:#121416;--panel:#20252a;--panel2:#2c3338;--line:#465057;--text:#eef2f3;--muted:#aeb8bd;--gold:#e5bd55;--red:#e86f6f;--green:#79d08a;--blue:#75b6e8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.35 system-ui,sans-serif;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}button{font:inherit;touch-action:manipulation}.app{max-width:760px;margin:auto;padding:10px;padding-top:max(10px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.title{font-weight:900;font-size:19px}.sub{color:var(--muted);font-size:12px}.stats{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.pill{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 8px;text-align:center;min-width:58px;font-size:11px}.pill b{display:block;font-size:16px}.risk{border-color:#8b7333}.risk b{color:var(--gold)}.section{margin-top:9px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px}.heading{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}.heroes{display:grid;grid-template-columns:1fr 1fr;gap:7px}.hero,.enemy{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px}.row{display:flex;justify-content:space-between;gap:7px}.name{font-weight:850}.bar{height:7px;background:#111;border-radius:99px;overflow:hidden;margin-top:6px}.fill{height:100%;background:var(--red)}.status{font-size:11px;color:var(--gold);min-height:15px;margin-top:4px}.enemies{display:grid;grid-template-columns:1fr 1fr;gap:7px}.intent{margin-top:7px;background:#171a1d;border-left:4px solid var(--red);padding:6px;border-radius:5px;font-size:12px;min-height:60px}.intent.special{border-left-color:var(--gold)}.enemy.selected{outline:2px solid var(--gold)}.enemy.dead{opacity:.3}.target{width:100%;min-height:39px;margin-top:6px;border:1px solid var(--line);background:#374046;color:var(--text);border-radius:7px}.cards{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;padding:2px 2px 10px}.card{flex:0 0 74vw;max-width:285px;min-height:168px;scroll-snap-align:center;text-align:left;border:1px solid #5d686f;border-top:4px solid var(--red);background:#31393e;color:var(--text);border-radius:9px;padding:10px;position:relative}.card.skill{border-top-color:var(--blue)}.card.support{border-top-color:var(--green)}.card:disabled{opacity:.35}.cost{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--gold);background:#111;font-weight:900}.owner{font-size:10px;color:var(--muted);text-transform:uppercase}.ct{font-size:17px;font-weight:900;margin:23px 0 6px}.noisy{display:inline-block;margin-top:9px;background:#4f3e18;color:#f8d276;border-radius:99px;padding:2px 7px;font-size:10px;font-weight:850}.end{width:100%;min-height:50px;border:0;border-radius:9px;background:var(--gold);color:#18140c;font-weight:900}.end:disabled{opacity:.4}.log{max-height:180px;overflow:auto;background:#15181a;border-radius:7px;padding:8px;font-size:12px}.log p{margin:0 0 6px;border-bottom:1px solid #292f33;padding-bottom:6px}.good{color:#9de6a9}.bad{color:#ffa08d}.info{color:#9dcef2}.noise{color:#f3cf72}.banner,.die,.modalwrap{position:fixed;inset:0;display:none;place-items:center;background:#0008;z-index:20;padding:18px}.banner.show,.die.show,.modalwrap.show{display:grid}.bannerbox{width:min(88vw,420px);background:#111e;border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center;font-weight:900;font-size:19px}.bannerbox.bad{border-color:var(--red);color:#ffd1c8}.bannerbox.good{border-color:var(--green);color:#caffd4}.bannerbox.info{border-color:var(--blue);color:#d1edff}.bannerbox.noise{border-color:var(--gold);color:#ffe69a}.diebox,.modal{width:min(88vw,360px);background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:18px;text-align:center}.dievalue{width:94px;height:94px;border:3px solid var(--gold);border-radius:17px;display:grid;place-items:center;margin:12px auto;font-size:37px;font-weight:950;background:#242018}.rewards{display:grid;gap:8px}.rewards button{min-height:48px;border:1px solid var(--line);background:#374046;color:var(--text);border-radius:8px}.encounters{display:flex;gap:6px;overflow:auto}.encounters button{white-space:nowrap;border:1px solid var(--line);background:#31383d;color:var(--text);border-radius:7px;padding:7px}.encounters button.active{border-color:var(--gold);background:#544821}.encounters button:disabled{opacity:.35}@media(min-width:700px){.card{flex-basis:220px}.enemies{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="app">
<div class="top"><div><div class="title">Zombie Card Combat</div><div class="sub">Two survivors. Limited ammo. Loud guns.</div></div><div class="stats"><div class="pill">Action<b id="ap">3</b></div><div class="pill">Ammo<b id="ammo">5</b></div><div class="pill risk">Noise<b>30%</b></div></div></div>
<div class="section"><div class="heading">Survivors</div><div class="heroes" id="heroes"></div></div>
<div class="section"><div class="row"><div><div class="heading" id="encTitle">Encounter</div><div class="sub" id="turn"></div></div><div class="sub" id="targetLabel"></div></div><div class="enemies" id="enemies"></div></div>
<div class="section"><div class="heading">Swipe cards · tap to play</div><div class="cards" id="cards"></div><button class="end" id="endBtn">END TURN</button></div>
<div class="section"><div class="heading">Encounters</div><div class="encounters" id="encounters"></div></div>
<div class="section"><div class="heading">Combat log</div><div class="log" id="log"></div></div>
</div>
<div class="banner" id="banner"><div class="bannerbox" id="bannerbox"></div></div>
<div class="die" id="die"><div class="diebox"><b>NOISE CHECK · d100</b><div class="dievalue" id="dievalue">?</div><div id="dieresult">Rolling…</div><div class="sub">1–5 Brute · 6–11 +3 · 12–20 +2 · 21–30 +1</div></div></div>
<div class="modalwrap" id="modalwrap"><div class="modal"><h2 id="modaltitle"></h2><p id="modaltext"></p><div class="rewards" id="rewards"></div></div></div>
<script>
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const baseDeck=[
{name:'Strike',owner:'MC',type:'attack',cost:1,text:'Deal 6 damage.',fx:'strike'},
{name:'Strike',owner:'MC',type:'attack',cost:1,text:'Deal 6 damage.',fx:'strike'},
{name:'Strike',owner:'MC',type:'attack',cost:1,text:'Deal 6 damage.',fx:'strike'},
{name:'Shoot',owner:'Gun Girl',type:'attack',cost:1,text:'Spend 1 Ammo. Deal 12 damage.',fx:'shoot',noisy:true},
{name:'Shoot',owner:'Gun Girl',type:'attack',cost:1,text:'Spend 1 Ammo. Deal 12 damage.',fx:'shoot',noisy:true},
{name:'Cover Fire',owner:'Gun Girl',type:'skill',cost:1,text:'Spend 1 Ammo. Deal 5. Both gain 4 Block.',fx:'cover',noisy:true},
{name:'Brace',owner:'MC',type:'skill',cost:1,text:'MC gains 6 Block.',fx:'brace'},
{name:'Brace',owner:'MC',type:'skill',cost:1,text:'MC gains 6 Block.',fx:'brace'},
{name:'Protect',owner:'MC',type:'skill',cost:1,text:'Redirect next hit on Gun Girl. Gain 4 Block.',fx:'protect'},
{name:'Bandage',owner:'Gun Girl',type:'support',cost:1,text:'Heal the most injured survivor by 5. Exhaust.',fx:'bandage',exhaust:true},
{name:'Shove',owner:'MC',type:'skill',cost:1,text:'Deal 2. Cancel a prepared special.',fx:'shove'}];
const defs=[{name:'1. Walker',unlocked:true,e:['walker']},{name:'2. Two Walkers',e:['walker','walker']},{name:'3. Screamer',e:['walker','screamer']},{name:'4. Grabber',e:['grabber','walker']},{name:'5. Brute',e:['brute']}];
const T={walker:{name:'Walker',hp:16,p:['claw','claw','lunge']},screamer:{name:'Screamer',hp:14,p:['prep','call','scratch']},grabber:{name:'Grabber',hp:20,p:['reach','hold','bite']},brute:{name:'Brute',hp:44,p:['heavy','brace','prepCharge','charge']}};
let S;
const shuffle=a=>{for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const hero=id=>S.heroes.find(h=>h.id===id);const alive=()=>S.enemies.filter(e=>e.hp>0);const sel=()=>S.enemies[S.selected];
function newState(){return{heroes:[{id:'mc',name:'Male MC',max:32,hp:32,block:0,status:[],protect:false},{id:'gun',name:'Gun Girl',max:24,hp:24,block:0,status:[],protect:false}],ammo:5,ap:3,turn:1,deck:[],discard:[],hand:[],exhaust:[],idx:0,enemies:[],selected:0,nextId:1,busy:false,done:false}}
function log(t,c=''){let p=document.createElement('p');p.textContent=t;p.className=c;document.querySelector('#log').prepend(p)}
function createEnemy(type){let t=T[type],n=S.enemies.filter(e=>e.type===type).length+1,e={id:S.nextId++,type,label:`${t.name} ${n}`,max:t.hp,hp:t.hp,p:[...t.p],step:0,armor:0,target:null,interrupted:false};assignTarget(e);return e}
function move(e){return e.p[e.step%e.p.length]}function assignTarget(e){e.target=['claw','lunge','scratch','heavy'].includes(move(e))?(Math.random()<.68?'mc':'gun'):['reach','hold','bite','charge'].includes(move(e))?'mc':null}
function intent(e){let d={claw:['Claw','6 damage'],lunge:['Lunge','10 damage'],scratch:['Scratch','4 damage'],prep:['Deep Breath','Next turn: summon 3'],call:['SCREAM','Summon 3 now'],reach:['Reach','4 damage + Grab'],hold:['Hold','MC attacks disabled'],bite:['Bite','10 damage'],heavy:['Heavy Swing','12 damage'],brace:['Brace','Gain 8 Armor'],prepCharge:['Lower Stance','Charge next turn'],charge:['Charge','15 damage + Stun']}[move(e)];return{title:d[0],desc:d[1],special:['lunge','prep','call','reach','hold','bite','prepCharge','charge'].includes(move(e))}}
function draw(n){for(let i=0;i<n;i++){if(!S.deck.length&&S.discard.length)S.deck=shuffle(S.discard.splice(0));if(S.deck.length)S.hand.push(S.deck.pop())}}
async function banner(t,c='info',ms=700){let w=document.querySelector('#banner'),b=document.querySelector('#bannerbox');b.textContent=t;b.className=`bannerbox ${c}`;w.classList.add('show');await wait(ms);w.classList.remove('show');await wait(100)}
function dmgEnemy(e,d){let a=Math.min(e.armor,d);e.armor-=a;d-=a;e.hp=Math.max(0,e.hp-d);log(`${e.label} takes ${d}${a?` (${a} armored)`:''}.`,'good')}
function hit(id,d){let h=hero(id),intercept=false;if(id==='gun'&&hero('mc').protect){h=hero('mc');hero('mc').protect=false;intercept=true}let b=Math.min(h.block,d);h.block-=b;d-=b;h.hp=Math.max(0,h.hp-d);return{h,d,b,intercept}}
async function noiseRoll(){let w=document.querySelector('#die'),v=document.querySelector('#dievalue'),r=document.querySelector('#dieresult');w.classList.add('show');r.textContent='Rolling…';for(let i=0;i<10;i++){v.textContent=1+Math.floor(Math.random()*100);await wait(55)}let x=1+Math.floor(Math.random()*100);v.textContent=x;let out='Quiet',kind='quiet',count=0;if(x<=5){out='A Brute heard it!';kind='brute'}else if(x<=11){out='3 Walkers rush in!';kind='walkers';count=3}else if(x<=20){out='2 Walkers rush in!';kind='walkers';count=2}else if(x<=30){out='1 Walker rushes in!';kind='walkers';count=1}r.textContent=`${x}: ${out}`;await wait(950);w.classList.remove('show');log(`Noise roll ${x}: ${out}.`,kind==='quiet'?'good':'noise');if(kind==='walkers')for(let i=0;i<count;i++)S.enemies.push(createEnemy('walker'));if(kind==='brute')S.enemies.push(createEnemy('brute'));if(kind!=='quiet')await banner(out,kind==='brute'?'bad':'noise',900);render()}
function can(c){if(S.busy||S.done||S.ap<c.cost)return false;if(['shoot','cover'].includes(c.fx)&&S.ammo<1)return false;if(hero('mc').status.includes('stunned')&&c.owner==='MC')return false;if(hero('mc').status.includes('grabbed')&&c.owner==='MC'&&c.type==='attack')return false;if(['strike','shoot','cover','shove'].includes(c.fx)&&(!sel()||sel().hp<=0))return false;return true}
async function play(id){let i=S.hand.findIndex(c=>c.id===id),c=S.hand[i];if(!c||!can(c))return;S.busy=true;S.ap-=c.cost;let e=sel();if(c.fx==='strike'){dmgEnemy(e,6);await banner(`MC strikes ${e.label} — 6`,'good')}if(c.fx==='shoot'){S.ammo--;dmgEnemy(e,12);await banner(`Gun Girl shoots ${e.label} — 12`,'good');if(hero('mc').status.includes('grabbed')){hero('mc').status=hero('mc').status.filter(x=>x!=='grabbed');await banner('The shot breaks MC free!','good')}}if(c.fx==='cover'){S.ammo--;dmgEnemy(e,5);hero('mc').block+=4;hero('gun').block+=4;await banner('Cover Fire — both gain 4 Block','good')}if(c.fx==='brace'){hero('mc').block+=6;await banner('MC gains 6 Block','good')}if(c.fx==='protect'){hero('mc').block+=4;hero('mc').protect=true;await banner('MC will intercept the next hit','good')}if(c.fx==='bandage'){let h=[...S.heroes].sort((a,b)=>a.hp/a.max-b.hp/b.max)[0],z=Math.min(5,h.max-h.hp);h.hp+=z;await banner(`${h.name} heals ${z}`,'good')}if(c.fx==='shove'){dmgEnemy(e,2);if(['prep','prepCharge'].includes(move(e))){e.interrupted=true;await banner(`${e.label}'s special is cancelled!`,'good')}else await banner(`MC shoves ${e.label} — 2`,'good')}S.hand.splice(i,1);(c.exhaust?S.exhaust:S.discard).push(c);render();if(c.noisy)await noiseRoll();if(!alive().length){S.busy=false;win();return}if(sel()&&sel().hp<=0)S.selected=S.enemies.findIndex(x=>x.hp>0);S.busy=false;render()}
async function enemyAttack(e,name,id,d){await banner(`${e.label} uses ${name} → ${hero(id).name}`,'bad',650);let r=hit(id,d);if(r.intercept)await banner('MC intercepts!','info',500);await banner(r.d?`${r.h.name} takes ${r.d}${r.b?` (${r.b} blocked)`:''}`:`${r.h.name} blocks everything`,r.d?'bad':'good',650);log(`${e.label}: ${name}, ${r.d} damage${r.b?`, ${r.b} blocked`:''}.`,r.d?'bad':'good')}
async function enemyTurn(){for(let e of [...S.enemies]){if(e.hp<=0)continue;let m=move(e);if(e.interrupted){e.interrupted=false;await banner(`${e.label} staggers`,'good');await enemyAttack(e,'Weak Swipe','mc',2);e.step+=2;assignTarget(e)}else{if(m==='claw')await enemyAttack(e,'Claw',e.target,6);if(m==='lunge')await enemyAttack(e,'Lunge',e.target,10);if(m==='scratch')await enemyAttack(e,'Scratch',e.target,4);if(m==='prep'){await banner(`${e.label} prepares to SCREAM`,'noise',900);log(`${e.label} will summon 3 next turn.`,'bad')}if(m==='call'){await banner(`${e.label} SCREAMS!`,'bad');for(let i=0;i<3;i++)S.enemies.push(createEnemy('walker'));await banner('3 Walkers enter!','bad',900)}if(m==='reach'){await enemyAttack(e,'Reach','mc',4);hero('mc').status.push('grabbed');await banner('MC is GRABBED','bad',800)}if(m==='hold'){if(hero('mc').status.includes('grabbed'))await banner(`${e.label} holds MC`,'bad');else await enemyAttack(e,'Swipe','mc',4)}if(m==='bite'){await enemyAttack(e,'Bite','mc',hero('mc').status.includes('grabbed')?10:5);hero('mc').status=hero('mc').status.filter(x=>x!=='grabbed')}if(m==='heavy')await enemyAttack(e,'Heavy Swing',e.target,12);if(m==='brace'){e.armor+=8;await banner(`${e.label} gains 8 Armor`,'bad')}if(m==='prepCharge'){await banner(`${e.label} prepares CHARGE`,'noise',900)}if(m==='charge'){await enemyAttack(e,'Charge','mc',15);hero('mc').status.push('stunned');await banner('MC is STUNNED','bad',800)}e.step++;assignTarget(e)}render();if(S.heroes.some(h=>h.hp<=0)){lose();return false}}return true}
async function endTurn(){if(S.busy||S.done)return;S.busy=true;S.hand.splice(0).forEach(c=>(c.exhaust?S.exhaust:S.discard).push(c));await banner('ENEMY TURN','info',450);if(!await enemyTurn())return;S.turn++;S.ap=3;S.heroes.forEach(h=>{h.block=0;h.protect=false});if(!hero('mc').status.includes('stunned'))hero('mc').status=hero('mc').status.filter(x=>x!=='stunned');draw(5);S.busy=false;render()}
function modal(title,text,opts){document.querySelector('#modaltitle').textContent=title;document.querySelector('#modaltext').textContent=text;let r=document.querySelector('#rewards');r.innerHTML='';opts.forEach(([t,f])=>{let b=document.createElement('button');b.textContent=t;b.onclick=f;r.appendChild(b)});document.querySelector('#modalwrap').classList.add('show')}
function win(){S.done=true;render();let last=S.idx===defs.length-1;modal(last?'Prototype Cleared':'Encounter Won',last?'You survived every encounter.':'Choose a recovery reward.',last?[['Reset Run',reset]]:[['+3 Ammo',()=>{S.ammo+=3;advance()}],['Heal Both 5',()=>{S.heroes.forEach(h=>h.hp=Math.min(h.max,h.hp+5));advance()}],['Heal MC 9',()=>{hero('mc').hp=Math.min(hero('mc').max,hero('mc').hp+9);advance()}]])}
function lose(){S.done=true;S.busy=false;render();modal('Run Failed','One survivor reached 0 HP.',[['Reset Run',reset]])}
function advance(){document.querySelector('#modalwrap').classList.remove('show');defs[S.idx+1].unlocked=true;start(S.idx+1)}
function start(i){S.idx=i;S.ap=3;S.turn=1;S.done=false;S.busy=false;S.deck=shuffle(baseDeck.map(c=>({...c,id:crypto.randomUUID()})));S.discard=[];S.hand=[];S.exhaust=[];S.enemies=[];S.nextId=1;defs[i].e.forEach(x=>S.enemies.push(createEnemy(x)));S.selected=0;S.heroes.forEach(h=>{h.block=0;h.status=[];h.protect=false});document.querySelector('#log').innerHTML='';draw(5);log(`Started ${defs[i].name}.`,'info');render()}
function reset(){S=newState();defs.forEach((d,i)=>d.unlocked=i===0);document.querySelector('#modalwrap').classList.remove('show');start(0)}
function render(){document.querySelector('#ap').textContent=S.ap;document.querySelector('#ammo').textContent=S.ammo;document.querySelector('#encTitle').textContent=defs[S.idx].name;document.querySelector('#turn').textContent=`Turn ${S.turn}`;document.querySelector('#targetLabel').textContent=sel()?`Target: ${sel().label}`:'';let h=document.querySelector('#heroes');h.innerHTML='';S.heroes.forEach(x=>{let d=document.createElement('div');d.className='hero';let st=[...x.status];if(x.block)st.push(`Block ${x.block}`);if(x.protect)st.push('Protecting');d.innerHTML=`<div class="row"><span class="name">${x.name}</span><span>${x.hp}/${x.max}</span></div><div class="bar"><div class="fill" style="width:${100*x.hp/x.max}%"></div></div><div class="status">${st.join(' · ')||'Ready'}</div>`;h.appendChild(d)});let er=document.querySelector('#enemies');er.innerHTML='';S.enemies.forEach((e,i)=>{let it=intent(e),d=document.createElement('div');d.className=`enemy ${e.hp<=0?'dead ':''}${i===S.selected&&e.hp>0?'selected':''}`;d.innerHTML=`<div class="row"><span class="name">${e.label}</span><span>${e.hp}/${e.max}</span></div><div class="bar"><div class="fill" style="width:${100*e.hp/e.max}%"></div></div><div class="status">${e.armor?`Armor ${e.armor}`:''}</div><div class="intent ${it.special?'special':''}"><b>${it.title}</b><br>${it.desc}${e.target?`<br><span class="status">Target: ${hero(e.target).name}</span>`:''}</div><button class="target" ${e.hp<=0?'disabled':''}>${i===S.selected?'Selected':'Target'}</button>`;d.querySelector('button').onclick=()=>{if(!S.busy){S.selected=i;render()}};er.appendChild(d)});let cr=document.querySelector('#cards');cr.innerHTML='';S.hand.forEach(c=>{let b=document.createElement('button');b.className=`card ${c.type}`;b.disabled=!can(c);b.innerHTML=`<span class="cost">${c.cost}</span><div class="owner">${c.owner}</div><div class="ct">${c.name}</div><div>${c.text}</div>${c.noisy?'<span class="noisy">NOISY · d100</span>':''}`;b.onclick=()=>play(c.id);cr.appendChild(b)});document.querySelector('#endBtn').disabled=S.busy||S.done;let en=document.querySelector('#encounters');en.innerHTML='';defs.forEach((d,i)=>{let b=document.createElement('button');b.textContent=d.name;b.disabled=!d.unlocked||S.busy;if(i===S.idx)b.className='active';b.onclick=()=>start(i);en.appendChild(b)})}
document.querySelector('#endBtn').onclick=endTurn;reset();
</script>
</body>
</html>
