<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>Zombie Card Prototype</title><style>body{margin:0;background:#121416;color:#eef2f3;font:16px system-ui;display:grid;place-items:center;min-height:100vh;padding:24px;text-align:center}.box{max-width:420px}.spinner{width:44px;height:44px;border:4px solid #3a4146;border-top-color:#e5bd55;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}a{color:#e5bd55}</style></head><body><div class="box"><div class="spinner"></div><strong>Loading mobile prototype…</strong><p id="status">Preparing the game.</p></div><script>(async()=>{const status=document.getElementById('status');try{const url='https://raw.githubusercontent.com/joel-wa/joel-wa.github.io/main/zombie-card-prototype/index.html?v='+Date.now();const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const html=await r.text();document.open();document.write(html);document.close()}catch(e){status.innerHTML='The game file could not be loaded. <a href="https://github.com/joel-wa/joel-wa.github.io/blob/main/zombie-card-prototype/index.html">View the source on GitHub</a>.';console.error(e)}})();</script></body></html>
